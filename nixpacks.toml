# nixpacks.toml

# Specify the providers (languages/tools) needed.
# We need Node.js and pnpm. You can specify a Node version if needed, e.g., 'node@18'.
providers = ["pnpm", "node"]

# Define build phases
[phases.setup]
# Ensure pnpm is available (usually handled by the 'pnpm' provider)
nixPkgs = ["...", "pnpm"] # "..." preserves existing Nix packages

[phases.install]
# Install dependencies using pnpm, respecting the lockfile
command = "npm install -g pnpm && pnpm install --frozen-lockfile"

[phases.build]
# Run the build command defined in your package.json (usually 'nuxt build')
command = "pnpm run build"

[start]
# Specify the command to start the built Nuxt application
command = "node .output/server/index.mjs"