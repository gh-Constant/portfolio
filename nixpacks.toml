# Tell Nixpacks which programming language packages to install
# It correctly detected 'bun', but explicitly adding it is good practice.
[phases.setup]
nixPkgs = ["nodejs_18", "bun"]

# Override the default install command
[phases.install]
cmds = ["bun install"] # Use bun install with the lockfile

# Ensure the build command uses bun (Nixpacks detected this correctly, but explicit is better)
[phases.build]
cmds = ["bun run build"]

# Define the start command for the built Nuxt app
[start]
cmd = "node .output/server/index.mjs" 